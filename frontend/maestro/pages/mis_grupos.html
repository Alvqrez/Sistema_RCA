<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mis Grupos — RCA</title>
    <script>
      if (localStorage.getItem("tema") === "oscuro")
        document.documentElement.classList.add("dark-mode");
    </script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link
      rel="icon"
      type="image/png"
      href="../../assets/images/icons/rca-icon.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar"></aside>
      <main class="content">
        <div class="page-header-v2">
          <div>
            <h1>Mis Grupos</h1>
            <p class="page-subtitle">Grupos asignados en el periodo actual</p>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-card">
            <iconify-icon icon="lucide:library"></iconify-icon>
            <div>
              <p id="statTotal">—</p>
              <span>Grupos</span>
            </div>
          </div>
          <div class="stat-card stat-success">
            <iconify-icon icon="lucide:users"></iconify-icon>
            <div>
              <p id="statActivos">—</p>
              <span>Activos</span>
            </div>
          </div>
          <div class="stat-card stat-purple">
            <iconify-icon icon="lucide:sliders-horizontal"></iconify-icon>
            <div>
              <p id="statConfigurados">—</p>
              <span>Configurados</span>
            </div>
          </div>
        </div>

        <!-- Filtros -->
        <div
          style="
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 14px;
          "
        >
          <input
            type="text"
            id="filtroNombre"
            placeholder="🔍 Buscar por materia o periodo…"
            oninput="filtrarGrupos()"
            style="flex: 1; min-width: 200px"
          />
          <select id="filtroEstatus" onchange="filtrarGrupos()">
            <option value="">Todos los estados</option>
            <option value="Activo">Activo</option>
            <option value="Cerrado">Cerrado</option>
            <option value="Cancelado">Cancelado</option>
          </select>
          <select id="filtroConfig" onchange="filtrarGrupos()">
            <option value="">Cualquier configuración</option>
            <option value="configurado">Configurados</option>
            <option value="sin-config">Sin configurar</option>
          </select>
        </div>

        <!-- Toggle vista Cards / Lista -->
        <div
          style="display: flex; justify-content: flex-end; margin-bottom: 14px"
        >
          <div
            style="
              display: flex;
              gap: 6px;
              background: var(--bg-app);
              border: 1px solid var(--border);
              border-radius: 8px;
              padding: 4px;
            "
          >
            <button
              id="btnVistaCards"
              onclick="setVista('cards')"
              style="
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 12px;
                border: none;
                border-radius: 6px;
                font-size: 0.82rem;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.15s;
                background: var(--primary);
                color: white;
              "
            >
              <iconify-icon icon="lucide:layout-grid"></iconify-icon> Cards
            </button>
            <button
              id="btnVistaLista"
              onclick="setVista('lista')"
              style="
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 12px;
                border: none;
                border-radius: 6px;
                font-size: 0.82rem;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.15s;
                background: transparent;
                color: var(--text-muted);
              "
            >
              <iconify-icon icon="lucide:list"></iconify-icon> Lista
            </button>
          </div>
        </div>

        <!-- Group cards grid -->
        <div
          id="loadingGrupos"
          style="text-align: center; padding: 48px; color: var(--text-muted)"
        >
          <iconify-icon
            icon="lucide:loader-2"
            style="font-size: 2rem; display: block; margin: 0 auto 10px"
          ></iconify-icon>
          <p>Cargando grupos…</p>
        </div>
        <!-- Vista Cards -->
        <div
          id="gruposGrid"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
          "
        ></div>

        <!-- Vista Lista -->
        <div id="gruposLista" style="display: none">
          <div
            style="
              background: var(--card-bg);
              border: 1px solid var(--border);
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <div
              style="
                display: grid;
                grid-template-columns: 2fr 90px 110px 110px 1fr;
                padding: 9px 18px;
                background: var(--bg-app);
                border-bottom: 1px solid var(--border);
              "
            >
              <p
                style="
                  font-size: 0.72rem;
                  font-weight: 700;
                  color: var(--text-muted);
                  text-transform: uppercase;
                  letter-spacing: 0.05em;
                  margin: 0;
                "
              >
                Grupo / Materia
              </p>
              <p
                style="
                  font-size: 0.72rem;
                  font-weight: 700;
                  color: var(--text-muted);
                  text-transform: uppercase;
                  letter-spacing: 0.05em;
                  margin: 0;
                  text-align: center;
                "
              >
                Alumnos
              </p>
              <p
                style="
                  font-size: 0.72rem;
                  font-weight: 700;
                  color: var(--text-muted);
                  text-transform: uppercase;
                  letter-spacing: 0.05em;
                  margin: 0;
                  text-align: center;
                "
              >
                Evaluación
              </p>
              <p
                style="
                  font-size: 0.72rem;
                  font-weight: 700;
                  color: var(--text-muted);
                  text-transform: uppercase;
                  letter-spacing: 0.05em;
                  margin: 0;
                  text-align: center;
                "
              >
                Estatus
              </p>
              <p
                style="
                  font-size: 0.72rem;
                  font-weight: 700;
                  color: var(--text-muted);
                  text-transform: uppercase;
                  letter-spacing: 0.05em;
                  margin: 0;
                  text-align: right;
                "
              >
                Acciones
              </p>
            </div>
            <div id="gruposListaBody"></div>
          </div>
        </div>
        <div
          id="emptyGrupos"
          style="
            display: none;
            text-align: center;
            padding: 64px;
            color: var(--text-muted);
          "
        >
          <iconify-icon
            icon="lucide:inbox"
            style="font-size: 3rem; display: block; margin: 0 auto 12px"
          ></iconify-icon>
          <p style="font-size: 1rem; font-weight: 600; margin: 0 0 6px">
            Sin grupos asignados
          </p>
          <p style="font-size: 0.85rem">
            Cuando el administrador te asigne un grupo aparecerá aquí.
          </p>
        </div>
      </main>
    </div>
    <div id="toast-container"></div>
    <script src="../../shared/js/sidebar.js"></script>
    <script>
      const tkn = () => localStorage.getItem("token");
      let _todosGrupos = [];
      let _gruposConActividad = new Set();

      function parsearToken(t) {
        try {
          return JSON.parse(atob(t.split(".")[1]));
        } catch {
          return null;
        }
      }

      function setVista(v) {
        localStorage.setItem("vista_grupos", v);
        const isCards = v === "cards";
        document.getElementById("gruposGrid").style.display = isCards
          ? "grid"
          : "none";
        document.getElementById("gruposLista").style.display = isCards
          ? "none"
          : "block";
        const btnC = document.getElementById("btnVistaCards");
        const btnL = document.getElementById("btnVistaLista");
        btnC.style.background = isCards ? "var(--primary)" : "transparent";
        btnC.style.color = isCards ? "white" : "var(--text-muted)";
        btnL.style.background = !isCards ? "var(--primary)" : "transparent";
        btnL.style.color = !isCards ? "white" : "var(--text-muted)";
      }

      function filtrarGrupos() {
        const q = (document.getElementById("filtroNombre")?.value || "")
          .toLowerCase()
          .trim();
        const estatus = document.getElementById("filtroEstatus")?.value || "";
        const cfg = document.getElementById("filtroConfig")?.value || "";

        const filtrados = _todosGrupos.filter((g) => {
          const matchQ =
            !q ||
            (g.nombre_materia || "").toLowerCase().includes(q) ||
            (g.descripcion_periodo || "").toLowerCase().includes(q) ||
            String(g.id_grupo).includes(q);
          const matchE = !estatus || g.estatus === estatus;
          const isCfg = _gruposConActividad.has(g.id_grupo);
          const matchC = !cfg || (cfg === "configurado" ? isCfg : !isCfg);
          return matchQ && matchE && matchC;
        });

        const grid = document.getElementById("gruposGrid");
        const listaBody = document.getElementById("gruposListaBody");
        const empty = document.getElementById("emptyGrupos");

        if (!filtrados.length) {
          grid.innerHTML = "";
          listaBody.innerHTML = "";
          empty.style.display = "block";
          empty.querySelector("p:last-child").textContent = q
            ? `Sin resultados para "${q}".`
            : "Sin grupos con ese filtro.";
          return;
        }
        empty.style.display = "none";

        grid.innerHTML = filtrados
          .map((g) => buildGrupoCard(g, _gruposConActividad))
          .join("");
        listaBody.innerHTML = filtrados
          .map((g, i) =>
            buildGrupoRow(g, i, filtrados.length, _gruposConActividad),
          )
          .join("");
      }

      async function cargarMisGrupos() {
        const payload = parsearToken(tkn());
        const id_ref = payload?.id_referencia;
        try {
          let grupos = [];
          try {
            const r = await fetch(`${API_URL}/api/grupos/mis-grupos`, {
              headers: { Authorization: `Bearer ${tkn()}` },
            });
            if (r.ok) grupos = await r.json();
          } catch (_) {}

          if (!Array.isArray(grupos) || !grupos.length) {
            const r2 = await fetch(`${API_URL}/api/grupos`, {
              headers: { Authorization: `Bearer ${tkn()}` },
            });
            const todos = await r2.json();
            grupos = id_ref
              ? todos.filter((g) => String(g.rfc) === String(id_ref))
              : todos;
          }

          document.getElementById("loadingGrupos").style.display = "none";

          if (!grupos.length) {
            document.getElementById("emptyGrupos").style.display = "block";
            document.getElementById("statTotal").textContent = 0;
            document.getElementById("statActivos").textContent = 0;
            document.getElementById("statConfigurados").textContent = 0;
            return;
          }

          const activos = grupos.filter((g) => g.estatus === "Activo").length;

          // Actividades para determinar grupos configurados
          let todasActividades = [];
          try {
            const rActs = await fetch(`${API_URL}/api/actividades`, {
              headers: { Authorization: `Bearer ${tkn()}` },
            });
            if (rActs.ok) todasActividades = await rActs.json();
          } catch (_) {}

          const unidadesConActPorGrupo = {};
          for (const a of todasActividades) {
            if (!unidadesConActPorGrupo[a.id_grupo])
              unidadesConActPorGrupo[a.id_grupo] = new Set();
            unidadesConActPorGrupo[a.id_grupo].add(a.id_unidad);
          }

          const unidadesTotalesPorGrupo = {};
          await Promise.all(
            grupos.map(async (g) => {
              try {
                const r = await fetch(
                  `${API_URL}/api/grupos/${g.id_grupo}/layout-unidades`,
                  {
                    headers: { Authorization: `Bearer ${tkn()}` },
                  },
                );
                if (r.ok) {
                  const uns = await r.json();
                  unidadesTotalesPorGrupo[g.id_grupo] = uns.length;
                } else unidadesTotalesPorGrupo[g.id_grupo] = 0;
              } catch (_) {
                unidadesTotalesPorGrupo[g.id_grupo] = 0;
              }
            }),
          );

          _gruposConActividad = new Set(
            grupos
              .filter((g) => {
                const total = unidadesTotalesPorGrupo[g.id_grupo] || 0;
                const conActs = unidadesConActPorGrupo[g.id_grupo];
                if (total === 0 || !conActs) return false;
                return conActs.size >= total;
              })
              .map((g) => g.id_grupo),
          );

          _todosGrupos = grupos;

          document.getElementById("statTotal").textContent = grupos.length;
          document.getElementById("statActivos").textContent = activos;
          document.getElementById("statConfigurados").textContent =
            _gruposConActividad.size;

          filtrarGrupos();

          const vistaGuardada = localStorage.getItem("vista_grupos") || "cards";
          setVista(vistaGuardada);
        } catch (e) {
          document.getElementById("loadingGrupos").innerHTML = `
            <iconify-icon icon="lucide:wifi-off" style="font-size:2rem;color:var(--danger);display:block;margin:0 auto 8px"></iconify-icon>
            <p style="color:var(--danger)">Error al cargar grupos</p>
            <button class="btn btn-outline btn-sm" onclick="location.reload()" style="margin-top:10px">
              <iconify-icon icon="lucide:refresh-cw"></iconify-icon> Reintentar
            </button>`;
        }
      }

      // ── Panel de alumnos expandible por grupo ──────────────────────────
      let _alumnosPanelAbierto = null;

      async function toggleAlumnosGrupo(id_grupo, btnEl) {
        const panelId = `alumnos-panel-${id_grupo}`;
        let panel = document.getElementById(panelId);

        if (panel) {
          // Ya existe — toggle
          const isOpen = panel.style.display !== "none";
          panel.style.display = isOpen ? "none" : "block";
          if (btnEl)
            btnEl.innerHTML = isOpen
              ? `<iconify-icon icon="lucide:users"></iconify-icon> Ver alumnos`
              : `<iconify-icon icon="lucide:chevron-up"></iconify-icon> Ocultar`;
          return;
        }

        // Crear panel
        panel = document.createElement("div");
        panel.id = panelId;
        panel.style.cssText =
          "margin-top:10px;border-top:1px solid var(--border);padding-top:10px";
        panel.innerHTML = `<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:.82rem">
          <iconify-icon icon="lucide:loader-2"></iconify-icon> Cargando alumnos…
        </div>`;
        btnEl?.closest(".card, div")?.appendChild(panel);
        if (btnEl)
          btnEl.innerHTML = `<iconify-icon icon="lucide:chevron-up"></iconify-icon> Ocultar`;

        try {
          const r = await fetch(`${API_URL}/api/reportes/grupo/${id_grupo}`, {
            headers: { Authorization: `Bearer ${tkn()}` },
          });
          if (!r.ok) throw new Error();
          const data = await r.json();
          const alumnos = data.alumnos || [];
          if (!alumnos.length) {
            panel.innerHTML = `<p style="font-size:.82rem;color:var(--text-muted);padding:8px 0">Sin alumnos inscritos en este grupo.</p>`;
            return;
          }
          panel.innerHTML = `
            <p style="font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--text-muted);margin:0 0 8px;text-transform:uppercase">
              Alumnos (${alumnos.length})
            </p>
            <div style="display:flex;flex-direction:column;gap:5px">
              ${alumnos
                .map((a) => {
                  const cal = a.calificacion_oficial;
                  const prov =
                    cal == null
                      ? Object.values(a.unidades || {})
                          .filter((u) => u.calificacion != null)
                          .reduce(
                            (s, u, _, arr) =>
                              s + parseFloat(u.calificacion) / arr.length,
                            0,
                          ) || null
                      : null;
                  const calMostrar = cal ?? prov;
                  const calStr =
                    calMostrar != null
                      ? `${prov != null ? "~" : ""}${parseFloat(calMostrar).toFixed(1)}`
                      : "—";
                  const calColor =
                    calMostrar == null
                      ? "var(--text-muted)"
                      : parseFloat(calMostrar) >= 70
                        ? "var(--success)"
                        : "var(--danger)";
                  const ini = (a.nombre_completo || "?")
                    .split(" ")
                    .slice(0, 2)
                    .map((w) => w[0] || "")
                    .join("")
                    .toUpperCase();
                  return `<div style="display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;background:var(--bg-app)">
                  <div style="width:30px;height:30px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${ini}</div>
                  <div style="flex:1;min-width:0">
                    <div style="font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.nombre_completo || "—"}</div>
                    <div style="font-size:.7rem;color:var(--text-muted)">${a.no_control}</div>
                  </div>
                  <span style="font-size:.82rem;font-weight:700;color:${calColor}">${calStr}</span>
                </div>`;
                })
                .join("")}
            </div>`;
        } catch (_) {
          panel.innerHTML = `<p style="font-size:.82rem;color:var(--danger);padding:8px 0">Error al cargar alumnos.</p>`;
        }
      }

      function buildGrupoRow(g, i, total, gruposConActividad = new Set()) {
        const hasConfig = gruposConActividad.has(g.id_grupo);
        const cfgBadge = hasConfig
          ? `<span class="badge badge-success" style="font-size:0.7rem">Configurado</span>`
          : `<span class="badge badge-warning" style="font-size:0.7rem">Sin config</span>`;
        const statusBadge =
          g.estatus === "Activo"
            ? `<span class="badge badge-success">${g.estatus}</span>`
            : `<span class="badge badge-danger">${g.estatus || "—"}</span>`;
        const isLast = i === total - 1;
        return `<div style="display:grid;grid-template-columns:2fr 90px 110px 110px 1fr;padding:12px 18px;align-items:center;${!isLast ? "border-bottom:1px solid var(--border)" : ""}">
          <div>
            <p style="font-size:0.9rem;font-weight:600;color:var(--text-main);margin:0">${g.nombre_materia || "—"}</p>
            <p style="font-size:0.78rem;color:var(--text-muted);margin:2px 0 0">Grupo #${g.id_grupo} · ${g.descripcion_periodo || "Periodo " + g.id_periodo}${g.horario ? " · " + g.horario : ""}</p>
          </div>
          <p style="font-size:0.9rem;color:var(--text-main);margin:0;text-align:center">${g.total_inscritos ?? 0}</p>
          <div style="text-align:center">${cfgBadge}</div>
          <div style="text-align:center">${statusBadge}</div>
          <div style="display:flex;gap:6px;justify-content:flex-end">
            <a href="captura_calificaciones.html?grupo=${g.id_grupo}" class="btn btn-primary btn-sm" style="text-decoration:none">
              <iconify-icon icon="lucide:pencil"></iconify-icon> Calificar
            </a>
            <a href="gruposMaestro.html?grupo=${g.id_grupo}" class="btn btn-outline btn-sm" style="text-decoration:none">
              <iconify-icon icon="lucide:settings"></iconify-icon>
            </a>
          </div>
        </div>`;
      }

      function buildGrupoCard(g, gruposConActividad = new Set()) {
        const statusColor =
          g.estatus === "Activo" ? "badge-success" : "badge-danger";
        const hasConfig = gruposConActividad.has(g.id_grupo);
        const cfgBadge = hasConfig
          ? `<span class="badge badge-success" style="font-size:0.7rem">Configurado</span>`
          : `<span class="badge badge-warning" style="font-size:0.7rem">Sin config</span>`;

        return `
          <div class="card" style="padding:0;overflow:hidden;">
            <div style="height:5px;background:var(--primary)"></div>
            <div style="padding:18px 20px">
              <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px">
                <div style="width:40px;height:40px;border-radius:10px;background:var(--primary-light);
                             display:flex;align-items:center;justify-content:center;flex-shrink:0">
                  <iconify-icon icon="lucide:book-open" style="color:var(--primary);font-size:1.2rem"></iconify-icon>
                </div>
                <div style="min-width:0;flex:1">
                  <h3 style="margin:0 0 4px;font-size:0.95rem;font-weight:600;color:var(--text-main);
                              white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                    ${g.nombre_materia || "—"}
                  </h3>
                  <p style="margin:0;font-size:0.78rem;color:var(--text-muted)">
                    Grupo #${g.id_grupo} · ${g.descripcion_periodo || "Periodo " + g.id_periodo}
                  </p>
                </div>
                <span class="badge ${statusColor}" style="flex-shrink:0">${g.estatus || "—"}</span>
              </div>

              <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:0.82rem">
                ${g.horario ? `<div style="display:flex;gap:8px;color:var(--text-muted)"><iconify-icon icon="lucide:clock"></iconify-icon><span>${g.horario}</span></div>` : ""}
                ${g.aula ? `<div style="display:flex;gap:8px;color:var(--text-muted)"><iconify-icon icon="lucide:map-pin"></iconify-icon><span>${g.aula}</span></div>` : ""}
                <div style="display:flex;gap:8px;align-items:center;color:var(--text-muted)">
                  <iconify-icon icon="lucide:settings-2"></iconify-icon>
                  <span>Evaluación: ${cfgBadge}</span>
                </div>
              </div>

              <div style="display:flex;gap:8px;flex-wrap:wrap" id="card-actions-${g.id_grupo}">
                <a href="captura_calificaciones.html?grupo=${g.id_grupo}"
                   class="btn btn-primary btn-sm" style="text-decoration:none;flex:1;justify-content:center">
                  <iconify-icon icon="lucide:pencil"></iconify-icon> Calificar
                </a>
                <button class="btn btn-outline btn-sm" style="flex:1;justify-content:center"
                  onclick="toggleAlumnosGrupo(${g.id_grupo}, this)">
                  <iconify-icon icon="lucide:users"></iconify-icon> Ver alumnos
                </button>
                <a href="gruposMaestro.html?grupo=${g.id_grupo}"
                   class="btn btn-outline btn-sm" style="text-decoration:none;justify-content:center">
                  <iconify-icon icon="lucide:sliders-horizontal"></iconify-icon> Configurar
                </a>
              </div>
            </div>
          </div>`;
      }

      cargarMisGrupos();
    </script>
  </body>
</html>
